const snapshotJs=String.raw`function marketNumber(v){const n=Number(String(v==null?'':v).replace(/[$,%\s,]/g,''));return Number.isFinite(n)?n:0}function marketMedian(values){const a=values.filter(v=>Number.isFinite(v)&&v>0).sort((x,y)=>x-y);if(!a.length)return null;const m=Math.floor(a.length/2);return a.length%2?a[m]:(a[m-1]+a[m])/2}function marketWithin(arr){if(!center)return[];const radius=Number(els.rad.value);return arr.filter(p=>Number.isFinite(Number(p.latitude))&&Number.isFinite(Number(p.longitude))&&miles(center.lat,center.lng,Number(p.latitude),Number(p.longitude))<=radius)}function snapshotMetric(value,label){return '<div class="snapshot-metric"><div class="snapshot-value">'+value+'</div><div class="snapshot-label">'+label+'</div></div>'}function renderMarketSnapshot(){const box=$('marketSnapshot');if(!box)return;if(!center){box.hidden=true;box.innerHTML='';return}const nearbyDev=marketWithin(dev),nearbyImp=marketWithin(imp),nearbyComp=marketWithin(comps);const pipeline=nearbyDev.filter(p=>dgroup(p.status)!=='completed');const newSites=pipeline.reduce((n,p)=>n+marketNumber(p.sites),0);const sold=nearbyComp.filter(p=>p.record_type==='Sold'&&marketNumber(p.sale_price)>0);const forSale=nearbyComp.filter(p=>p.record_type==='For Sale');const soldSites=sold.reduce((n,p)=>n+marketNumber(p.units),0);const ppu=marketMedian(sold.map(p=>marketNumber(p.price_per_unit)||(marketNumber(p.units)>0?marketNumber(p.sale_price)/marketNumber(p.units):0)));const caps=marketMedian(sold.map(p=>marketNumber(p.cap_rate)));const saleVolume=sold.reduce((n,p)=>n+marketNumber(p.sale_price),0);const demand=nearbyImp.filter(p=>p.impact_direction!=='Negative'&&/major|high/i.test(String(p.impact_level||'')));const jobs=nearbyImp.reduce((n,p)=>n+marketNumber(p.jobs),0);let signals=[];if(newSites)signals.push(newSites.toLocaleString()+' planned/active sites may add competitive supply');if(demand.length)signals.push(demand.length+' major demand project'+(demand.length===1?'':'s')+' may suppo
